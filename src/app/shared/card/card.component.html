<article class="company-card" data-aos="fade-left">
    <img class="card-image" [src]="company.logoUrl" [alt]="company.name" loading="lazy" />
    <div class="card-body">
        <h3 class="card-title">{{ company.name }}</h3>
        <p class="card-subtitle">{{ company.role }}</p>
        <p class="card-description">{{ company.description }}</p>
    </div>
</article>
